name: Package

# Builds Tagalot with PyInstaller on Windows, macOS, and Linux (DESIGN.md §3 "Packaging"),
# checks each build with `tagalot --check`, makes its installer (packaging/installer.sh: a
# setup .exe, a .dmg, an AppImage), installs it and checks that too, and uploads both. A `v*` tag, pushed or made by
# publishing a release on GitHub, also attaches the builds to that release; its version
# must be the code's (`tagalot.__version__`).

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
    paths:
      - "packaging/**"
      - "src/tagalot/resources/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/package.yml"
      - "src/tagalot/__main__.py"
      - "src/tagalot/selfcheck.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked --group package
      - name: Check the tag is this version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(uv run python -c "import tagalot; print(tagalot.__version__)")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the code's version $version"
            exit 1
          fi
      - run: uv run pyinstaller packaging/tagalot.spec --noconfirm
      - name: Check the build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) app=dist/tagalot/tagalot.exe ;;
            macOS) app=dist/Tagalot.app/Contents/MacOS/tagalot ;;
            *) app=dist/tagalot/tagalot ;;
          esac
          status=0
          "$app" --check --output check.txt || status=$?
          cat check.txt
          exit $status
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v iscc && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi
      - name: Make the installer
        shell: bash
        run: |
          out=$(bash packaging/installer.sh | tail -n 1)
          mv "$out" .
          echo "INSTALLER=$(basename "$out")" >> "$GITHUB_ENV"
      - name: Install it and check it
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              dir="$RUNNER_TEMP/TagalotInstalled"
              # //: Git Bash would otherwise turn /VERYSILENT into a path.
              "./$INSTALLER" //VERYSILENT //SUPPRESSMSGBOXES //CURRENTUSER \
                "//DIR=$(cygpath -w "$dir")"
              app="$dir/tagalot.exe" ;;
            macOS)
              hdiutil attach "$INSTALLER" -nobrowse -readonly -mountpoint /tmp/tagalot-dmg
              app=/tmp/tagalot-dmg/Tagalot.app/Contents/MacOS/tagalot ;;
            *)
              chmod +x "$INSTALLER"
              export APPIMAGE_EXTRACT_AND_RUN=1  # no FUSE on the runner
              app="./$INSTALLER" ;;
          esac
          status=0
          "$app" --check --output installed-check.txt || status=$?
          cat installed-check.txt
          [ "$RUNNER_OS" != macOS ] || hdiutil detach /tmp/tagalot-dmg
          exit $status
      - name: Archive
        shell: bash
        run: |
          version=$(uv run python -c "import tagalot; print(tagalot.__version__)")
          name="Tagalot-$version-$RUNNER_OS-$RUNNER_ARCH"
          [ "$RUNNER_OS" = macOS ] || cp packaging/README.txt dist/tagalot/
          case "$RUNNER_OS" in
            Windows) (cd dist && 7z a -bd "../$name.zip" tagalot > /dev/null) ;;
            macOS) ditto -c -k --keepParent dist/Tagalot.app "$name.zip" ;;
            *) tar -C dist -czf "$name.tar.gz" tagalot ;;
          esac
          ls -l Tagalot-*
      - uses: actions/upload-artifact@v7
        with:
          name: tagalot-${{ runner.os }}
          path: Tagalot-*
          if-no-files-found: error

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: builds
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="Install with Tagalot-…-Windows-setup.exe, the macOS .dmg (drag Tagalot to Applications), or the Linux .AppImage (make it executable and run it). The .zip and .tar.gz hold the same program, to unzip and run without installing: keep the folder together. The builds aren't signed yet: Windows and macOS ask before running them (see the README)."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Tagalot $TAG" \
              --notes "$notes" --generate-notes
          gh release upload "$TAG" builds/* --repo "$GITHUB_REPOSITORY" --clobber
