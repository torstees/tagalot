<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#5FC8E8"/>
      <stop offset="1" stop-color="#2A6FB8"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0E2C4"/>
      <stop offset="0.6" stop-color="#DCC79F"/>
      <stop offset="1" stop-color="#B89E72"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC95C"/>
      <stop offset="1" stop-color="#F29C2B"/>
    </linearGradient>
  </defs>

  <!-- rounded badge background -->
  <circle cx="128" cy="128" r="122" fill="url(#bg)"/>

  <g stroke="#2B2233" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- battlement: wall top with merlons, bottom follows the badge edge -->
    <path d="M56 226.5 L56 152 L92 152 L92 174 L110 174 L110 152 L146 152 L146 174 L164 174 L164 152 L200 152 L200 226.5 A122 122 0 0 1 56 226.5 Z" fill="url(#stone)"/>

    <!-- flagpole on the left merlon -->
    <line x1="74" y1="44" x2="74" y2="152" stroke-width="7"/>
    <circle cx="74" cy="38" r="8" fill="#FFC95C" stroke-width="5"/>

    <!-- tag flag: pointed end at the pole, tied through its hole -->
    <path d="M88 86 L114 54 L194 54 Q204 54 204 64 L204 108 Q204 118 194 118 L114 118 Z" fill="url(#tag)"/>
    <circle cx="118" cy="86" r="9" fill="#2A6FB8" stroke-width="5"/>
    <path d="M110 82 Q94 70 76 66 M110 90 Q94 102 76 106" fill="none" stroke-width="4"/>
  </g>

  <!-- highlights -->
  <line x1="128" y1="66" x2="188" y2="66" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="66" y1="186" x2="66" y2="210" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="#1E3F6E" stroke-width="5"/>
</svg>
