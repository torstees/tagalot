<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#5FC8E8"/>
      <stop offset="1" stop-color="#2A6FB8"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0E2C4"/>
      <stop offset="0.6" stop-color="#DCC79F"/>
      <stop offset="1" stop-color="#B89E72"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC95C"/>
      <stop offset="1" stop-color="#F29C2B"/>
    </linearGradient>
  </defs>

  <!-- rounded badge background -->
  <circle cx="128" cy="128" r="122" fill="url(#bg)"/>
  <!-- grassy hill -->
  <path d="M39.5 212 Q128 188 216.5 212 A122 122 0 0 1 39.5 212 Z" fill="#5DBB63"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="#1E3F6E" stroke-width="5"/>

  <g stroke="#2B2233" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- flagpole -->
    <line x1="128" y1="36" x2="128" y2="84" stroke-width="5"/>
    <circle cx="128" cy="33" r="5" fill="#FFC95C" stroke-width="3.5"/>

    <!-- tag flag: pointed end toward the pole, hole tied to it -->
    <path d="M138 58 L152 42 L190 40 Q197 40 197 47 L197 70 Q197 77 190 77 L152 74 Z" fill="url(#tag)" stroke-width="5"/>
    <circle cx="154" cy="58" r="5" fill="#2A6FB8" stroke-width="3"/>
    <path d="M150 58 Q140 52 130 50 M150 59 Q140 64 130 66" fill="none" stroke="#2B2233" stroke-width="2.5"/>

    <!-- tower body -->
    <path d="M86 112 L170 112 L170 214 L86 214 Z" fill="url(#stone)"/>
    <!-- parapet with merlons -->
    <path d="M78 84 L100 84 L100 96 L114 96 L114 84 L142 84 L142 96 L156 96 L156 84 L178 84 L178 114 L78 114 Z" fill="url(#stone)"/>

    <!-- stone courses -->
    <g fill="none" stroke="#8C7550" stroke-width="3">
      <line x1="90" y1="140" x2="110" y2="140"/>
      <line x1="146" y1="140" x2="166" y2="140"/>
      <line x1="98" y1="166" x2="118" y2="166"/>
      <line x1="140" y1="170" x2="160" y2="170"/>
      <line x1="92" y1="194" x2="106" y2="194"/>
      <line x1="152" y1="196" x2="166" y2="196"/>
    </g>

    <!-- window -->
    <path d="M120 152 L120 138 Q120 128 128 128 Q136 128 136 138 L136 152 Z" fill="#2B2233"/>
    <!-- door -->
    <path d="M112 214 L112 188 Q112 172 128 172 Q144 172 144 188 L144 214 Z" fill="#8A5A2B"/>
  </g>
  <line x1="128" y1="176" x2="128" y2="211" stroke="#5E3A1A" stroke-width="2.5"/>
  <circle cx="137" cy="196" r="2.5" fill="#FFC95C"/>
  <!-- warm light in window -->
  <path d="M123 150 L123 139 Q123 131 128 131 Q133 131 133 139 L133 150 Z" fill="#FFD36B" opacity="0.85"/>
  <!-- highlights -->
  <line x1="94" y1="120" x2="94" y2="206" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <path d="M158 47 L186 46" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
</svg>
