<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#5FC8E8"/>
      <stop offset="1" stop-color="#2A6FB8"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5484D"/>
      <stop offset="1" stop-color="#B42B33"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC95C"/>
      <stop offset="1" stop-color="#F29C2B"/>
    </linearGradient>
  </defs>

  <!-- rounded badge background -->
  <circle cx="128" cy="128" r="122" fill="url(#bg)"/>
  <ellipse cx="128" cy="226" rx="44" ry="7" fill="#1E3F6E" opacity="0.35"/>

  <g stroke="#2B2233" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- heater shield -->
    <path d="M62 54 Q128 36 194 54 L194 126 Q194 186 128 218 Q62 186 62 126 Z" fill="url(#shield)"/>
    <!-- tag emblem -->
    <path d="M76 134 L100 106 L172 106 Q181 106 181 115 L181 153 Q181 162 172 162 L100 162 Z" fill="url(#tag)"/>
    <circle cx="104" cy="134" r="8.5" fill="#B42B33" stroke-width="5"/>
  </g>

  <!-- shield highlight -->
  <path d="M76 66 Q100 58 124 56" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="#1E3F6E" stroke-width="5"/>
</svg>
