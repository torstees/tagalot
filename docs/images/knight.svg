<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#5FC8E8"/>
      <stop offset="1" stop-color="#2A6FB8"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FAEC0"/>
      <stop offset="0.45" stop-color="#E8EEF5"/>
      <stop offset="1" stop-color="#8A99AD"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC95C"/>
      <stop offset="1" stop-color="#F29C2B"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5484D"/>
      <stop offset="1" stop-color="#B42B33"/>
    </linearGradient>
  </defs>

  <!-- rounded badge background -->
  <circle cx="128" cy="128" r="122" fill="url(#bg)" stroke="#1E3F6E" stroke-width="5"/>
  <ellipse cx="128" cy="216" rx="62" ry="9" fill="#1E3F6E" opacity="0.35"/>

  <g stroke="#2B2233" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- spear (behind body) -->
    <line x1="188" y1="64" x2="188" y2="222" stroke-width="13"/>
    <line x1="188" y1="64" x2="188" y2="222" stroke="#A86B32" stroke-width="5"/>
    <path d="M188 30 L200 56 L188 68 L176 56 Z" fill="url(#steel)"/>

    <!-- feet -->
    <ellipse cx="110" cy="210" rx="13" ry="7" fill="#5A3B22"/>
    <ellipse cx="146" cy="210" rx="13" ry="7" fill="#5A3B22"/>

    <!-- tag body -->
    <path d="M92 118 L164 118 L164 192 Q164 206 150 206 L106 206 Q92 206 92 192 Z" fill="url(#tag)"/>

    <!-- right arm holding spear -->
    <path d="M162 162 Q174 164 182 158" fill="none" stroke-width="15"/>
    <path d="M162 162 Q174 164 182 158" fill="none" stroke="#F7AE3E" stroke-width="5"/>
    <circle cx="188" cy="157" r="10" fill="#FFC14F"/>

    <!-- helmet shell (pointed like a tag's tip) -->
    <path d="M84 134 L84 100 Q84 66 128 48 Q172 66 172 100 L172 134 Q128 144 84 134 Z" fill="url(#steel)"/>
    <!-- open face: the tag's face shows through -->
    <path d="M98 104 Q98 94 108 94 L148 94 Q158 94 158 104 L158 126 Q128 136 98 126 Z" fill="url(#tag)"/>

    <!-- raised visor resting on the brow, pivoting at the sides -->
    <path d="M86 90 Q128 66 170 90 L168 72 Q128 46 88 72 Z" fill="url(#steel)"/>
    <path d="M104 76 Q128 63 152 76" fill="none" stroke-width="6"/>
    <circle cx="90" cy="88" r="5" fill="#C9D3DE" stroke-width="3.5"/>
    <circle cx="166" cy="88" r="5" fill="#C9D3DE" stroke-width="3.5"/>

    <!-- smile -->
    <path d="M119 118 Q128 126 137 118" fill="none" stroke-width="4"/>

    <!-- tag grommet + string plume -->
    <path d="M128 50 C120 30 140 18 150 28 C158 36 148 46 142 38 C136 30 152 16 166 26" fill="none" stroke="#2B2233" stroke-width="8"/>
    <path d="M128 50 C120 30 140 18 150 28 C158 36 148 46 142 38 C136 30 152 16 166 26" fill="none" stroke="#F2F2F2" stroke-width="3"/>
    <circle cx="128" cy="52" r="6" fill="#F2F2F2" stroke-width="4"/>

    <!-- shield -->
    <path d="M52 140 L110 140 L110 166 Q110 196 81 212 Q52 196 52 166 Z" fill="url(#shield)"/>
    <path d="M66 168 L76 158 L96 158 Q99 158 99 161 L99 175 Q99 178 96 178 L76 178 Z" fill="#FFC95C" stroke-width="3.5"/>
    <circle cx="77" cy="168" r="2.6" fill="#B42B33" stroke="none"/>
  </g>

  <!-- eyes -->
  <circle cx="115" cy="107" r="5" fill="#2B2233"/>
  <circle cx="141" cy="107" r="5" fill="#2B2233"/>
  <circle cx="116.5" cy="105.5" r="1.8" fill="#FFFFFF"/>
  <circle cx="142.5" cy="105.5" r="1.8" fill="#FFFFFF"/>
  <!-- cheeks -->
  <circle cx="106" cy="117" r="4.5" fill="#FF7A6B" opacity="0.6"/>
  <circle cx="150" cy="117" r="4.5" fill="#FF7A6B" opacity="0.6"/>
  <!-- highlights -->
  <path d="M91 124 Q89 106 95 96" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M100 70 Q112 62 122 59" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
</svg>
