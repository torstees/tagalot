[project]
name = "tagalot"
version = "0.8.0"
description = "A tag-based file browser for music, movies, books, papers, and art, that never changes your files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Torstenson" }]
requires-python = ">=3.12"
keywords = ["tags", "file browser", "music", "movies", "ebooks", "research papers", "digital assets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Multimedia",
    "Typing :: Typed",
]
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "Pillow>=10.0",
    "mutagen>=1.47",
    "py7zr>=0.21",
    "rarfile>=4.2",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
    "pymediainfo>=7.0.1",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
]

[project.urls]
Homepage = "https://github.com/torstees/tagalot"
Documentation = "https://torstees.github.io/tagalot/"
Repository = "https://github.com/torstees/tagalot"
Issues = "https://github.com/torstees/tagalot/issues"
Releases = "https://github.com/torstees/tagalot/releases"

[project.scripts]
tagalot = "tagalot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260906",
]
package = [
    "pyinstaller>=6.20",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplifications
    "PT",  # pytest style
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Themes (built-in, and ones declared in tests) use class-level lists by design (DESIGN.md §9).
"src/tagalot/builtin_themes/*" = ["RUF012"]
"src/tagalot/themes/template.py" = ["RUF012"]
"tests/**" = ["RUF012"]

# Keep the hand-aligned examples in docs/*.md as written.
[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["rarfile", "pypdfium2"]  # no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
# QT_QPA_PLATFORM=offscreen is set in tests/conftest.py, before Qt is imported.
qt_api = "pyside6"
markers = [
    "gui: needs a QApplication (runs headless via the offscreen Qt platform)",
    "slow: benchmarks and other long-running tests",
]
# Fail on SQLAlchemy deprecations so API changes are fixed when they appear.
filterwarnings = ["error::sqlalchemy.exc.SADeprecationWarning"]
# A test still running after 5 minutes is hung: print every thread's stack to show where.
faulthandler_timeout = 300

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"
