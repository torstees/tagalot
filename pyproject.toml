[project]
name = "tagalot"
version = "0.1.0"
description = "Tag-based file browser organized into keeps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Torstenson" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "Pillow>=10.0",
    "mutagen>=1.47",
    "py7zr>=0.21",
    "rarfile>=4.2",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
]

[project.scripts]
tagalot = "tagalot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplifications
    "PT",  # pytest style
    "RUF", # ruff-specific
]

# Keep the hand-aligned examples in docs/*.md as written.
[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
# QT_QPA_PLATFORM=offscreen is set in tests/conftest.py, before Qt is imported.
qt_api = "pyside6"
markers = [
    "gui: needs a QApplication (runs headless via the offscreen Qt platform)",
    "slow: benchmarks and other long-running tests",
]
# Fail on SQLAlchemy deprecations so API changes are fixed when they appear.
filterwarnings = ["error::sqlalchemy.exc.SADeprecationWarning"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"
